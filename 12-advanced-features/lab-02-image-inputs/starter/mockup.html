<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mockup — product card</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --card: #ffffff;
        --ink: #2b2118;
        --muted: #6b5c4e;
        --accent: #8a4b2d;
        --pill: #efe6d7;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        margin: 0;
        padding: 40px;
        display: flex;
        justify-content: center;
      }
      .card {
        background: var(--card);
        width: 320px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      .card h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .card .subtitle {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 14px;
      }
      .card .price {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .card .tags {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .card .tag {
        background: var(--pill);
        color: var(--ink);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
      }
      .card button {
        width: 100%;
        background: var(--ink);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pacific Espresso</h1>
      <p class="subtitle">Medium roast · Single origin</p>
      <span class="price">$18.50</span>
      <div class="tags">
        <span class="tag">Chocolate</span>
        <span class="tag">Caramel</span>
      </div>
      <button>Add to cart</button>
    </div>
  </body>
</html>
